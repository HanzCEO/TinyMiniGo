[package]
name = "tinyminigo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
clap = { version = "4", features = ["derive"] }
minijinja = "2.24.0"
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
rand = { version = "0.10.2", features = ["std_rng"] }
safetensors = "0.8.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokenizers = "0.23.1"
